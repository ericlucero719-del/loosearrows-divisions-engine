<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOSEARROWS | OSIRIS-APEX Command Cockpit</title>
<style>
  :root {
    --bg-obsidian: #06090e;
    --bg-panel: rgba(13, 19, 28, 0.92);
    --amber-core: #ff7b00;
    --amber-glow: #ffaa33;
    --text-main: #e6edf3;
    --text-muted: #8b949e;
    --border-amber: rgba(255, 123, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-obsidian);
    color: var(--text-main);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 85% 15%, rgba(255, 110, 0, 0.16) 0%, transparent 40%),
      radial-gradient(circle at 15% 60%, rgba(20, 65, 95, 0.25) 0%, transparent 50%),
      linear-gradient(rgba(18, 36, 54, 0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(18, 36, 54, 0.2) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 35px 35px, 35px 35px;
    padding-bottom: 40px;
  }

  /* Top Navigation */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px;
    background: rgba(6, 9, 14, 0.95);
    border-bottom: 1px solid var(--border-amber);
    flex-wrap: wrap;
    gap: 10px;
  }

  .nav-links {
    display: flex;
    gap: 20px;
    list-style: none;
    flex-wrap: wrap;
  }

  .nav-links li {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    cursor: pointer;
    padding-bottom: 3px;
    transition: all 0.2s ease;
  }

  .nav-links li:hover, .nav-links li.active {
    color: #fff;
    border-bottom: 2px solid var(--amber-core);
    text-shadow: 0 0 8px rgba(255, 123, 0, 0.6);
  }

  .telemetry-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    letter-spacing: 1px;
    background: rgba(255, 123, 0, 0.1);
    border: 1px solid var(--border-amber);
    padding: 5px 12px;
    border-radius: 4px;
    color: var(--amber-glow);
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Hero Command Header */
  .hero {
    max-width: 1280px;
    margin: 20px auto;
    padding: 28px 24px;
    background: linear-gradient(135deg, rgba(12, 18, 28, 0.95), rgba(24, 14, 8, 0.9));
    border: 1px solid var(--border-amber);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255, 110, 0, 0.12);
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .arrow-emblem {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-title h1 {
    font-size: clamp(1.6rem, 3.5vw, 2.6rem);
    letter-spacing: 3.5px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 15px rgba(255, 123, 0, 0.4);
  }

  .brand-title p {
    font-size: 0.85rem;
    letter-spacing: 4px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .motto {
    margin-top: 18px;
    font-size: clamp(0.95rem, 2vw, 1.25rem);
    font-weight: 700;
    letter-spacing: 2.2px;
    color: var(--amber-glow);
    text-shadow: 0 0 10px rgba(255, 123, 0, 0.6);
  }

  /* Division Nodes Bar */
  .nodes-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
  }

  .node-btn {
    background: rgba(10, 15, 22, 0.9);
    border: 1px solid rgba(255, 123, 0, 0.4);
    color: #fff;
    padding: 9px 16px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }

  .node-btn::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--amber-core);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--amber-core);
  }

  .node-btn:hover, .node-btn.active {
    background: rgba(255, 123, 0, 0.2);
    border-color: var(--amber-glow);
    box-shadow: 0 0 12px rgba(255, 123, 0, 0.3);
  }

cat > ~/restart-web.sh << 'EOF'
#!/bin/bash
# Kill everything on port 8080 and start the LooseArrows server fresh
cd ~/loosearrows_web || exit 1

command -v fuser >/dev/null 2>&1 || pkg install -y psmisc

fuser -k 8080/tcp 2>/dev/null
pkill -f "http.server 8080" 2>/dev/null
sleep 1

nohup python3 -m http.server 8080 >/dev/null 2>&1 &
echo "Fresh server on http://localhost:8080 (PID $!)"
