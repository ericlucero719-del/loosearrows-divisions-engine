<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSIRIS-APEX | LooseArrows Cockpit</title>
    <style>
        :root {
            --bg: #080b10;
            --card: rgba(16, 22, 34, 0.85);
            --border: #1e293b;
            --accent: #f59e0b;
            --green: #10b981;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body {
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text);
            padding: 16px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .brand h1 { font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
        .brand p { font-size: 0.75rem; color: var(--muted); }
        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn:disabled { opacity: 0.5; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
        }
        .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
        .stat-val { font-size: 1.1rem; font-weight: bold; margin-top: 4px; color: var(--green); }
        .stat-val.warn { color: var(--accent); }
        .section-title { font-size: 0.85rem; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
        .lead-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--green);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .lead-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
        .margin-badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .lead-meta { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
        #status-bar { font-size: 0.75rem; color: var(--accent); margin-bottom: 12px; min-height: 16px; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <h1>OSIRIS-APEX COCKPIT</h1>
            <p>LooseArrows Supply & Logistics | CAGE: 8LLN1</p>
        </div>
        <button class="btn" id="sweep-btn" onclick="triggerSweep()">⚡ RUN SWEEP</button>
    </header>

    <div id="status-bar">System Online. Telemetry synced.</div>

    <div class="grid">
        <div class="stat-card">
            <div class="stat-label">Qualified Leads</div>
            <div class="stat-val" id="lead-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Margin Floor</div>
            <div class="stat-val">22.0%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">BLM PO 140L1726P0032</div>
            <div class="stat-val warn">PENDING IPP</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Target FSCs</div>
            <div class="stat-val" style="font-size:0.85rem; color:var(--text);">5305, 5306, 5310</div>
        </div>
    </div>

    <div class="section-title">Active DIBBS Micro-Purchase Queue</div>
    <div id="leads-container">Loading telemetry...</div>

    <script>
        async function loadLeads() {
            try {
                const res = await fetch('/dibbs_scraped_leads.json?t=' + Date.now());
                const leads = await res.json();
                document.getElementById('lead-count').innerText = leads.length;
                const container = document.getElementById('leads-container');
                if (!leads.length) {
                    container.innerHTML = '<div class="lead-meta">No qualified leads above 22% margin floor.</div>';
                    return;
                }
                container.innerHTML = leads.map(l => `
                    <div class="lead-card">
                        <div class="lead-top">
                            <span>${l.solicitation_id}</span>
                            <span class="margin-badge">+${(l.calculated_margin * 100).toFixed(1)}% MARGIN</span>
                        </div>
                        <div class="lead-meta">
                            <strong>NSN:</strong> ${l.nsn} (${l.nsn_desc})<br>
                            <strong>QTY:</strong> ${l.qty} | <strong>Target Gov:</strong> $${l.target_gov_price.toFixed(2)} | <strong>Est. Cost:</strong> $${(l.estimated_unit_cost * l.qty).toFixed(2)}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('leads-container').innerHTML = '<div class="lead-meta">Error reading dibbs_scraped_leads.json</div>';
            }
        }

        async function triggerSweep() {
            const btn = document.getElementById('sweep-btn');
            const status = document.getElementById('status-bar');
            btn.disabled = true;
            status.innerText = '[*] Executing osiris_dibbs_bot.py sweep...';
            try {
                const res = await fetch('/run-sweep');
                const data = await res.json();
                status.innerText = '[+] ' + data.message;
                await loadLeads();
            } catch (e) {
                status.innerText = '[-] Sweep execution error.';
            }
            btn.disabled = false;
        }

        loadLeads();
    </script>
</body>
</html>
